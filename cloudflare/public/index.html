<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Studio · Cloud bootstrap</title><link rel="stylesheet" href="/style.css"><body><header><h1>Card Studio</h1><p>Приватный bootstrap · синтетические изображения · без вызовов AI</p></header><main><section><h2>Готовность среды</h2><pre id="preflight">Проверка…</pre><p>Приватный редактор v9 здесь не подключён. Варианты ниже — три простых тестовых фона, не рекомендации AI.</p></section><section><h2>Новый тест</h2><label>Тема<input id="theme" value="Коллекция игрушек"></label><button id="plan">Заполнить mock-план</button><label>Объекты JSON<textarea id="objects" rows="7">[{"object_id":"001","name":"Тестовая форма","brief":"Synthetic rounded toy shape with a transparent hole."}]</textarea></label><button id="run">Создать mock-исследование</button><button id="dispatch">Отправить ожидающие задания</button><p id="status" role="status"></p></section><section><h2>Исследования</h2><button id="refresh">Обновить</button><div id="studies"></div></section><section id="review"><h2>Проверка результатов</h2><div id="jobs"></div></section></main><script type="module" src="/app.js"></script></body></html>
